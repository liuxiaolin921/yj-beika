<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>公路实务 · 真题刷题</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1f2733; --sub:#6b7686;
    --line:#e4e8ef; --brand:#2f6df0; --brand-d:#1f53c4;
    --ok:#1e9e5a; --bad:#e0533d; --warn:#e8a33d; --chip:#eef2fb; --muted:#8a94a6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;}
  .wrap{max-width:760px; margin:0 auto; padding:14px 14px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .ttl{font-size:18px; font-weight:700;}
  .ttl small{display:block; font-size:11px; color:var(--sub); font-weight:400; margin-top:2px;}
  .stats{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .stat{background:var(--chip); border-radius:10px; padding:4px 9px; font-size:12px; color:var(--sub);}
  .stat b{color:var(--ink); font-size:13px;}
  /* 顶部 Tab */
  .tabs{display:flex; background:var(--chip); border-radius:12px; padding:3px; margin-bottom:12px;}
  .tabs button{flex:1; border:0; background:transparent; padding:9px 4px; border-radius:9px;
    font-size:14px; color:var(--sub); font-weight:600; cursor:pointer;}
  .tabs button.on{background:#fff; color:var(--brand); box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .tabs button .cnt{font-size:11px; opacity:.75;}
  /* 控制条 */
  .ctrl{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; margin-bottom:12px;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .row + .row{margin-top:8px;}
  select, input[type=text]{font-size:14px; padding:8px 10px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); flex:1; min-width:110px;}
  input[type=text]{flex:2; min-width:150px;}
  .mini{font-size:12px; padding:7px 10px; border-radius:9px; border:1px solid var(--line);
    background:#fff; color:var(--sub); cursor:pointer;}
  .mini.on{color:var(--brand); border-color:#bcd0f7; background:#f3f7ff;}
  .mini.danger{color:var(--bad); border-color:#f3c9c1;}
  /* 卡片 */
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 16px;
    box-shadow:0 2px 10px rgba(31,39,51,.04);}
  .crumbs{font-size:12px; color:var(--sub); margin-bottom:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:7px; font-weight:600;}
  .b-year{background:var(--chip); color:var(--brand);}
  .b-single{background:#e8f0fe; color:#1a56db;}
  .b-multi{background:#fff3e0; color:#b26a00;}
  .b-case{background:#efe9fb; color:#6d43c8;}
  .b-ok{background:#e3f6ec; color:var(--ok);}
  .b-bad{background:#fdeae6; color:var(--bad);}
  .b-part{background:#fff3e0; color:var(--warn);}
  .b-new{background:#eef1f5; color:var(--sub);}
  .b-flag{background:#fdeaea; color:#c0392b;}
  .q{font-size:17px; font-weight:700; line-height:1.65; margin:8px 0 4px; white-space:pre-wrap; word-break:break-word;}
  .opts{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; gap:9px; align-items:flex-start; text-align:left; width:100%;
    background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px;
    font-size:15px; line-height:1.55; color:var(--ink); cursor:pointer;}
  .opt .ol{font-weight:700; color:var(--brand); flex:none;}
  .opt.sel{border-color:var(--brand); background:#f3f7ff;}
  .opt.hit{border-color:var(--ok); background:#effaf3;}
  .opt.hit .ol{color:var(--ok);}
  .opt.miss{border-color:var(--bad); background:#fdf1ef;}
  .opt.miss .ol{color:var(--bad);}
  .opt:disabled{cursor:default;}
  .ans{margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; display:none;}
  .ans.show{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);}to{opacity:1;}}
  .ans-line{font-size:15px; margin-bottom:8px;}
  .ans-line b{color:var(--ok);}
  .expl{font-size:14px; line-height:1.8; color:var(--ink); white-space:pre-wrap; word-break:break-word;
    background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .expl .cap{display:block; font-size:12px; font-weight:700; color:var(--brand); margin-bottom:4px;}
  .flagbox{margin-top:8px; font-size:12px; line-height:1.6; color:#c0392b; background:#fdf3f2;
    border:1px dashed #f0c4bd; border-radius:10px; padding:8px 10px;}
  .verdict{margin-top:10px; font-size:14px; font-weight:700;}
  .verdict.ok{color:var(--ok);} .verdict.bad{color:var(--bad);} .verdict.part{color:var(--warn);}
  /* 按钮 */
  .acts{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .btn{flex:1; min-width:0; border:0; border-radius:12px; padding:11px 4px; font-size:14px;
    font-weight:700; cursor:pointer; color:#fff; background:var(--brand); white-space:nowrap;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:#fff; color:var(--brand); border:1px solid #d6e0f5;}
  .btn.warn{background:var(--warn);}
  .btn.okb{background:var(--ok);}
  .btn.badb{background:var(--bad);}
  .btn.fav.on{background:#fff7ec; color:var(--warn); border:1px solid var(--warn);}
  /* 列表 */
  .li{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    margin-bottom:8px; cursor:pointer;}
  .li:active{background:var(--chip);}
  .li .qt{font-size:14.5px; font-weight:600; line-height:1.55;}
  .li .meta{font-size:11px; color:var(--sub); margin-top:6px; display:flex; gap:5px; flex-wrap:wrap; align-items:center;}
  .li .badge{font-size:10px; padding:1px 6px;}
  .grp-h{font-weight:700; font-size:14px; color:var(--brand); margin:14px 0 8px; border-left:4px solid var(--brand); padding-left:8px;}
  /* 案例 */
  .bg{font-size:15px; line-height:1.85; white-space:pre-wrap; word-break:break-word;}
  .sq{border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; background:#fff;}
  .sq .qq{font-size:15px; font-weight:600; line-height:1.65; white-space:pre-wrap; word-break:break-word;}
  .sq .aa{margin-top:10px; display:none; border-top:1px dashed var(--line); padding-top:10px;
    font-size:14.5px; line-height:1.8; white-space:pre-wrap; word-break:break-word; color:#14532d;
    background:#f2fbf5; border-radius:8px; padding:10px;}
  .sq .aa.show{display:block; animation:fade .25s ease;}
  .sq .mini{margin-top:8px;}
  .ph{color:var(--sub); font-size:15px; text-align:center; padding:40px 0;}
  .pos{font-size:12px; color:var(--sub); margin:4px 0 10px;}
  .toast{position:fixed; left:50%; bottom:76px; transform:translateX(-50%); background:rgba(31,39,51,.92);
    color:#fff; font-size:13px; padding:9px 16px; border-radius:20px; opacity:0; transition:.25s; z-index:99; pointer-events:none; max-width:86vw;}
  .toast.show{opacity:1;}
  footer{margin-top:20px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .empty{text-align:center; color:var(--sub); padding:40px 0; font-size:14px;}
  .list-count{font-size:12px; color:var(--sub); margin:2px 2px 10px; font-weight:600;}
  .modal{position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal.show{display:flex;}
  .modal .box{background:#fff; border-radius:16px; max-width:560px; width:100%; max-height:80vh; overflow:auto; padding:18px; font-size:13.5px; line-height:1.8;}
  .modal h3{margin:0 0 8px; font-size:16px;}
  .modal pre{background:#f6f8fb; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:12px; overflow:auto; white-space:pre-wrap; word-break:break-all;}
  @media (max-width:420px){
    .q{font-size:16px;}
    .btn{font-size:13px; padding:10px 3px;}
    .ttl{font-size:16px;}
  }
  /* 千题斩（填空默写） */
  .qian-q .qno{color:var(--brand); font-weight:800; margin-right:4px;}
  .qblank{font-size:15px; padding:2px 6px; border:1px solid #c7d2e6; border-radius:6px; min-width:48px; text-align:center; background:#fff; vertical-align:baseline;}
  .qblank.ok{border-color:#2faa5a; background:#e8f8ee; color:#15703a;}
  .qblank.bad{border-color:#e2553f; background:#fdecea; color:#c0392b;}
  .qans{display:none; margin:10px 0 2px; padding:10px 12px; background:#f3f7ff; border-radius:8px; font-size:14px; line-height:1.7;}
  .qans.show{display:block; animation:fade .25s ease;}
  .qans .ab{display:inline-block; margin-right:10px; color:#0a4ea8; font-weight:600;}
  .qresult{font-size:13px; font-weight:700; margin:6px 0; min-height:18px;}
  .qactions{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .qstars{margin-left:auto; display:flex; gap:2px;}
  .qstar{border:none; background:#eef1f6; color:#b9c2d0; font-size:15px; line-height:1; padding:6px 8px; border-radius:8px; cursor:pointer; transition:.15s;}
  .qstar.on.s1{background:#ffe7a8; color:#a9710a;}
  .qstar.on.s2{background:#bfeae3; color:#0a7a6b;}
  .qstar.on.s3{background:#bfe9c9; color:#15703a;}
  /* 简答默写（参考建筑抽背：连续2字标绿） */
  .qwrite{width:100%; min-height:96px; margin:10px 0 2px; font-size:15px; line-height:1.7;
    padding:11px 12px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink);
    resize:vertical; font-family:inherit; box-sizing:border-box;}
  .qwrite:focus{outline:none; border-color:#bcd0f7; box-shadow:0 0 0 3px #eef4ff;}
  .qdiff{margin:8px 0 2px;}
  .qdiff:empty{display:none;}
  .qdiff .meta{font-size:12.5px; color:var(--sub); line-height:1.6; margin-bottom:4px;}
  .diff-cap{font-size:12px; font-weight:700; color:var(--brand); margin:8px 0 4px;}
  .diff-box{font-size:14.5px; line-height:1.9; white-space:pre-wrap; word-break:break-word;
    background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px;}
  .hit{color:var(--ok);}
  .miss{color:var(--bad); text-decoration:line-through;}
  .miss-ans{color:var(--bad); font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ttl">公路实务 · 真题刷题<small id="srcNote"></small></div>
    <div class="stats">
      <span class="stat">已刷 <b id="stDone">0</b></span>
      <span class="stat">正确率 <b id="stRate">—</b></span>
      <span class="stat">收藏 <b id="stFav">0</b></span>
      <span class="stat">错题 <b id="stWrong">0</b></span>
    </div>
  </header>

  <div class="tabs" id="mainTabs">
    <button data-t="choice" class="on">选择题 <span class="cnt" id="cntChoice"></span></button>
    <button data-t="case">案例题 <span class="cnt" id="cntCase"></span></button>
    <button data-t="fav">收藏 <span class="cnt" id="cntFav"></span></button>
    <button data-t="wrong">错题本 <span class="cnt" id="cntWrong"></span></button>
    <button data-t="qian">千题斩 <span class="cnt" id="cntQian"></span></button>
  </div>

  <!-- ============ 选择题 ============ -->
  <section id="view-choice">
    <div class="ctrl">
      <div class="row">
        <select id="cYear"><option value="">全部年份</option></select>
        <select id="cType">
          <option value="">全部题型</option>
          <option value="single">单选</option>
          <option value="multiple">多选</option>
        </select>
        <select id="cStatus">
          <option value="">全部状态</option>
          <option value="new">未刷</option>
          <option value="ok">答对</option>
          <option value="bad">答错/半对</option>
          <option value="fav">收藏</option>
        </select>
      </div>
      <div class="row">
        <input type="text" id="cSearch" placeholder="搜索题干关键词…">
        <button class="mini" id="cModeBtn">切换列表</button>
      </div>
    </div>
    <div class="list-count" id="cCount"></div>
    <div id="cPractice"></div>
    <div id="cList" style="display:none"></div>
  </section>

  <!-- ============ 案例题 ============ -->
  <section id="view-case" style="display:none">
    <div class="ctrl">
      <div class="row">
        <select id="kYear"><option value="">全部年份</option></select>
        <select id="kStatus">
          <option value="">全部状态</option>
          <option value="new">未刷</option>
          <option value="ok">答对</option>
          <option value="bad">没答好</option>
          <option value="fav">收藏</option>
        </select>
        <input type="text" id="kSearch" placeholder="搜索案例标题/背景…">
      </div>
    </div>
    <div class="list-count" id="kCount"></div>
    <div id="kList"></div>
    <div id="kDetail"></div>
  </section>

  <!-- ============ 收藏 ============ -->
  <section id="view-fav" style="display:none"><div id="favBody"></div></section>
  <!-- ============ 错题本 ============ -->
  <section id="view-wrong" style="display:none"><div id="wrongBody"></div></section>

  <!-- ============ 千题斩（填空默写） ============ -->
  <section id="view-qian" style="display:none">
    <div class="ctrl">
      <div class="row">
        <select id="qPian"><option value="">全部篇</option></select>
        <select id="qChap"><option value="">全部章</option></select>
        <select id="qSec"><option value="">全部小节</option></select>
      </div>
      <div class="row">
        <select id="qStar">
          <option value="">全部标注</option>
          <option value="0">未标注</option>
          <option value="1">一星（生疏）</option>
          <option value="2">二星（模糊）</option>
          <option value="3">三星（熟练）</option>
          <option value="undone">未练习</option>
        </select>
        <input type="text" id="qSearch" placeholder="搜索题干关键词…">
      </div>
      <div class="row" style="color:var(--sub);font-size:12px">
        <span id="qCount"></span>
        <span style="margin-left:auto">★ 标注：一星=生疏 · 二星=模糊 · 三星=熟练（点卡片下方星标即可标注，进度自动保存）</span>
      </div>
    </div>
    <div id="qianList"></div>
  </section>

  <footer>
    <button class="mini" id="importBtn">📥 导入题库</button>
    <button class="mini" id="helpBtn">使用说明</button>
    <button class="mini danger" id="resetBtn">清空进度</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </footer>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="helpModal">
  <div class="box">
    <h3>使用说明</h3>
    <div id="helpBody"></div>
    <div style="text-align:right;margin-top:12px"><button class="btn ghost" id="helpClose" style="max-width:120px">关闭</button></div>
  </div>
</div>

<script>
const DATA = {"meta": {"title": "公路实务 · 真题刷题", "source": "老船长《真题汇编详解 2016-2025》（2026版）", "note": "数据源：视觉识别扫描版 PDF（2025 年全套已录，其余年份待补）。个别 OCR 不确定处已在题目标注 flag。", "schema": {"banks[].id": "题库唯一ID（导入时同ID覆盖）", "banks[].name": "题库名称（显示用）", "questions[].type": "choice=选择题 / case=案例题", "choice.sub": "single=单选 / multiple=多选", "choice.options": "选项数组（不含A/B/C字母前缀，按顺序对应）", "choice.answer": "答案字母数组", "case.subQuestions[].a": "参考答案（含采分点分值）"}}, "banks": [{"id": "lc-zt-2025", "name": "2025 年真题（老船长汇编）", "questions": [{"qid": "c2025-01", "type": "choice", "sub": "single", "year": 2025, "no": 1, "stem": "湿软土路基的质量指标是（　）。", "options": ["灰剂量、压实度", "含水量、压实度", "厚度、压实度", "灰剂量、孔隙比"], "answer": ["A"], "explain": "改良后的湿黏土路基质量应采用灰剂量与压实度两个指标控制。"}, {"qid": "c2025-02", "type": "choice", "sub": "single", "year": 2025, "no": 2, "stem": "下列关于渗井说法正确的是（　）。", "options": ["渗井顶部及四周应设置反滤层", "渗井反滤层两侧应封闭", "渗井透水层应设粗砂和砾石", "渗井应边开挖边支撑"], "answer": ["D"], "explain": "A错：井壁与填充料之间应设反滤层（不是顶部及四周）。B错：渗井顶部四周应采用黏土填筑围护并加盖封闭。C错：透水层范围宜填碎石或卵石，不透水范围宜填粗砂或砾石。"}, {"qid": "c2025-03", "type": "choice", "sub": "single", "year": 2025, "no": 3, "stem": "属于同一批的是（　）。", "options": ["同一产区、同一次购入、同一规格的运至生产现场的沥青", "同一料源、同一次购入、同一规格的运至生产现场的沥青", "同一产区、同一次购入、同一规格的运至生产现场的矿料", "同一料源、同一次购入、同一规格的运至生产现场的矿料"], "answer": ["D"], "explain": "各种材料都必须在施工以前以「批」为单位检查：矿料以同一料源、同一次购入并运至生产现场的相同规格材料为一批；沥青以同一来源、同一次购入且储入同一沥青罐的同一规格的沥青为一批（沥青有「同一沥青罐」要求，直接排除A、B；产区≠料源）。"}, {"qid": "c2025-04", "type": "choice", "sub": "single", "year": 2025, "no": 4, "stem": "高温期水泥面层养护用（　）。", "options": ["透水土工布", "白色反光膜", "黑色吸热膜", "蓝色吸热膜"], "answer": ["B"], "explain": "高温期施工时，宜选用白色反光面膜的节水保湿养护膜；低温期宜选用黑色或蓝色吸热面膜的产品。"}, {"qid": "c2025-05", "type": "choice", "sub": "single", "year": 2025, "no": 5, "stem": "预应力筋应力控制时，以（　）校核。", "options": ["变形模量", "伸长值", "应变值", "张拉力"], "answer": ["B"], "explain": "预应力筋采用应力控制方法张拉时，应以伸长值进行校核，实际伸长值与理论伸长值的差值应控制在±6%以内，否则应暂停张拉，查明原因并采取措施予以调整后方可继续张拉。"}, {"qid": "c2025-06", "type": "choice", "sub": "single", "year": 2025, "no": 6, "stem": "桥梁支架安放后，支架处空隙应采用（　）填充。", "options": ["高性能混凝土", "水泥砂浆", "环氧树脂砂浆", "水泥玻璃浆"], "answer": ["C"], "explain": "调整支座的顶面高程时，应采用钢垫片对支座进行支垫，支垫处在支座安装完成后留下的空隙应采用环氧树脂砂浆填实。"}, {"qid": "c2025-07", "type": "choice", "sub": "single", "year": 2025, "no": 7, "stem": "预报长度分类，地质雷达适用于（　）预报。", "options": ["短距离", "中距离", "长距离", "特长距离"], "answer": ["A"], "explain": "地质超前预报按预报长度分三类：短距离预报 L＜30m（地质调查法、超前钻探法、地质雷达法）；中距离预报 30m≤L＜100m（弹性波反射法）；长距离预报 L≥100m。"}, {"qid": "c2025-08", "type": "choice", "sub": "single", "year": 2025, "no": 8, "stem": "下列关于掌子面与仰拱、二次衬砌的距离，正确的是（　）。", "options": ["Ⅲ级围岩仰拱到掌子面的距离不超过100m", "Ⅳ级围岩仰拱到掌子面的距离不超过70m", "Ⅳ级围岩二次衬砌到掌子面的距离不大于90m", "Ⅴ级围岩二次衬砌到掌子面的距离不大于80m"], "answer": ["C"], "explain": "隧道安全步距指隧道仰拱或二次衬砌到掌子面的安全距离，由围岩级别决定。仰拱：Ⅴ（或Ⅵ）级≤40m、Ⅳ级≤50m、Ⅲ级≤90m；二次衬砌：Ⅴ（或Ⅵ）级≤70m、Ⅳ级≤90m。故C正确。"}, {"qid": "c2025-09", "type": "choice", "sub": "single", "year": 2025, "no": 9, "stem": "下列关于护栏施工说法，正确的是（　）。", "options": ["钢护栏在基层之前施工", "现场条件允许时，长度较长的混凝土护栏可采用滑模施工", "桥梁在脚手架拆除前安装护栏", "护栏和栏杆产品到场后，螺栓、螺母等紧固件和连接件应在防腐处理前清理螺纹"], "answer": ["B"], "explain": "A错：立柱打入的护栏宜在路面下面层施工完毕后施工，不得早于路面基层施工。C错：桥梁护栏和栏杆应在桥梁车道板、人行道板、混凝土铺装层施工完毕，跨中支架及脚手架拆除后桥跨处于独立支撑状态时方能施工。D错：应在防腐处理后清理螺纹或进行离心分离处理。"}, {"qid": "c2025-10", "type": "choice", "sub": "single", "year": 2025, "no": 10, "stem": "根据《工程总承包招标规范》，工程总承包招标，招标人向投标人提供（　）、勘察设计资料。", "options": ["初步设计文件", "施工图设计文件", "分包工程量清单", "施工总进度计划"], "answer": ["A"], "explain": "工程总承包招标，招标人向投标人提供初步设计文件、勘察设计资料（工程常识考查）。"}, {"qid": "c2025-11", "type": "choice", "sub": "single", "year": 2025, "no": 11, "stem": "公路工程计量所需设备由（　）提供。", "options": ["发包人", "承包人", "监理人", "质监机构"], "answer": ["B"], "explain": "约定俗成：承包人在现场施工，计量所需设备由承包人提供。"}, {"qid": "c2025-12", "type": "choice", "sub": "single", "year": 2025, "no": 12, "stem": "关于劳动力不均衡系数，说法正确的是（　）。", "options": ["施工期全体人数与施工期平均人数相比", "施工期高峰人数与施工期全体人数相比", "施工期平均人数与施工期高峰人数之比", "施工期高峰人数与施工期平均人数之比"], "answer": ["D"], "explain": "劳动力不均衡系数＝施工期高峰人数与施工期平均人数之比，接近于1为好。"}, {"qid": "c2025-13", "type": "choice", "sub": "single", "year": 2025, "no": 13, "stem": "实现专业化生产，尽可能地利用工作面进行施工，属于（　）。", "options": ["顺序作业法", "流水作业法", "平行作业法", "分段作业法"], "answer": ["B"], "explain": "流水作业法＝专业化＋充分利用工作面。"}, {"qid": "c2025-14", "type": "choice", "sub": "single", "year": 2025, "no": 14, "stem": "高速公路大桥主体结构垮塌，属于（　）质量事故。", "options": ["特别重大质量事故", "重大质量事故", "较大质量事故", "一般质量事故"], "answer": ["C"], "explain": "较大质量事故：造成直接经济损失1000万元以上5000万元以下，或者高速公路项目中桥或大桥主体结构垮塌、中隧道或长隧道结构坍塌、路基整体滑移，或者中型水运工程主体结构垮塌、报废的事故。"}, {"qid": "c2025-15", "type": "choice", "sub": "single", "year": 2025, "no": 15, "stem": "下列属于防眩设施关键项目的是（　）。", "options": ["安装高度", "防眩板间距", "竖直度", "防眩网网孔尺寸"], "answer": ["A"], "explain": "防眩设施关键项目为安装高度。"}, {"qid": "c2025-16", "type": "choice", "sub": "single", "year": 2025, "no": 16, "stem": "场地内运输钢筋的拖车司机工资属于（　）。", "options": ["人工费", "材料费", "机械费", "措施费"], "answer": ["C"], "explain": "自有机械总费用＝某种机械型号的（不变费用＋可变费用）。可变费用包括燃、油料费，电费，驾驶人员工资及其他费用等。机械得有人驾驶，驾驶员工资算在机械费（不能算作人工费），且属于可变费用。"}, {"qid": "c2025-17", "type": "choice", "sub": "single", "year": 2025, "no": 17, "stem": "下列关于安全风险分级管控说法，正确的是（　）。", "options": ["风险等级有5个", "较大风险一般会引发较大事故", "重大风险一般会引发特别重大安全事故", "连续出现两个，按最低等级"], "answer": ["C"], "explain": "风险等级按可能导致安全生产事故的后果和概率，由低到高分为低风险（Ⅰ级）、一般风险（Ⅱ级）、较大风险（Ⅲ级）和重大风险（Ⅳ级）四个等级。重大风险指一定条件下易导致特别重大安全生产事故的风险。同时满足两个以上条件的，按最高等级确定风险等级（D错）。"}, {"qid": "c2025-18", "type": "choice", "sub": "single", "year": 2025, "no": 18, "stem": "下列关于施工安全管理措施的说法，正确的是（　）。", "options": ["基坑周边堆土高度为2m", "基坑底部工人有专人指挥，可以以人工和机械同时作业", "施工现场旁边有架空电线，应设专人监护", "基坑内应设安全梯上下，不得采用土坡道等攀登措施"], "answer": ["C"], "explain": "A错：堆土应距基坑边缘1m以外，堆土高度不得超过1.5m。B错：人工清基应在挖掘机停止运转、且挖掘机指挥人员同意后进行，严禁在机械回转范围内作业。D错：基坑内应设安全梯或土坡道等攀登设施（土坡道是允许的）。"}, {"qid": "c2025-19", "type": "choice", "sub": "single", "year": 2025, "no": 19, "stem": "预制梁场内机械操作规程应设置于（　）。", "options": ["场地入口处", "机械设备旁", "拌合楼旁", "场内"], "answer": ["B"], "flag": "原书选项D印刷不清，按解析表（操作规程→机械设备旁）修正为「场内」。", "explain": "预制场标识表：操作规程（各机械设备操作要求）设置位置为机械设备旁。场地入口处放预制场简介牌。"}, {"qid": "c2025-20", "type": "choice", "sub": "single", "year": 2025, "no": 20, "stem": "沥青混凝土高等级公路建设应使用（　）拌和设备。", "options": ["连续滚筒式", "自落式", "强制间歇式", "双锥螺旋搅拌机"], "answer": ["C"], "explain": "沥青混凝土拌和设备：高等级公路建设应使用强制间歇式拌和设备，连续滚筒式拌和设备用于普通公路建设。"}, {"qid": "c2025-21", "type": "choice", "sub": "multiple", "year": 2025, "no": 21, "stem": "施工过程中桩板式抗滑桩挡土墙应监测（　）。", "options": ["截水沟流量", "地下水位", "滑体位移", "滑体变形", "挡土板后土压力"], "answer": ["B", "C", "D"], "explain": "施工过程中应对地下水位、滑体位移和变形进行监测。"}, {"qid": "c2025-22", "type": "choice", "sub": "multiple", "year": 2025, "no": 22, "stem": "符合级配的天然砂砾适用于（　）。", "options": ["轻交通一级公路底基层", "重交通三级公路基层", "轻交通一级公路基层", "重交通二级公路基层", "轻交通二级公路基层"], "answer": ["A", "B"], "explain": "符合级配的天然砂砾适用于轻交通的二级及以下公路的基层、各级公路的底基层。口诀：潜所疏泥灰（潜=嵌入）。"}, {"qid": "c2025-23", "type": "choice", "sub": "multiple", "year": 2025, "no": 23, "stem": "关于钻孔灌注桩，下列做法正确的是（　）。", "options": ["直径2.5m的钻孔灌注桩扩孔直径2.8m", "旋挖钻钻到粉质砂层要降低钻头速度", "采用加深钻孔的方式代替清孔", "不得直接将钢筋骨架支撑在孔底，应用钢丝绳将其吊挂在孔口的钢护筒上", "混凝土坍落度宜为160～220mm"], "answer": ["A", "B", "E"], "explain": "A对：在陆上或浅水区筑岛处的护筒，其内径应大于桩径至少200mm，壁厚应能使护筒保持圆筒状且不变。B对：在粉砂层或黏质砂土层中升降速度应更加缓慢。C错：不得采用加深钻孔深度的方式代替清孔。D错：应将其吊挂在孔口的钢护筒上，或在孔口地面上设置扩大受力面积的装置进行吊挂，且不应采用钢丝绳或其他容易变形的材料进行吊挂。"}, {"qid": "c2025-24", "type": "choice", "sub": "multiple", "year": 2025, "no": 24, "stem": "关于隧道衬砌构造的说法，正确的有（　）。", "options": ["洞口段应设加强衬砌", "围岩较好地段衬砌应向围岩较差地段延伸", "一般衬砌段应向偏压段延伸", "一般Ⅳ～Ⅵ级围岩地段设仰拱", "路面与仰拱之间可采用混凝土或片石混凝土填充"], "answer": ["A", "D", "E"], "explain": "B错：围岩较差地段衬砌应向围岩较好地段延伸5～10m。C错：偏压衬砌段应向一般衬砌段延伸，延伸长度应根据偏压情况确定，不宜小于10m。"}, {"qid": "c2025-25", "type": "choice", "sub": "multiple", "year": 2025, "no": 25, "stem": "下列系统中，属于公路监控系统的有（　）。", "options": ["视频监控子系统", "ETC门架子系统", "光纤数字传输子系统", "火灾自动报警子系统", "隧道通风控制子系统"], "answer": ["A", "D", "E"], "explain": "监控系统按其功能可分为九个子系统：交通（信号）监控、视频监控、调度（指令）电话、火灾自动报警、隧道通风控制、隧道照明控制、电力监控、隧道紧急电话、隧道广播子系统。B、C属于收费/通信系统。"}, {"qid": "c2025-26", "type": "choice", "sub": "multiple", "year": 2025, "no": 26, "stem": "属于企业管理费的有（　）。", "options": ["措施费", "职工探亲路费", "财务费用", "规费", "安全生产费"], "answer": ["B", "C"], "explain": "企业管理费是指组织和管理工程施工所需的各项费用，由基本费用、主副食运输补贴、职工探亲路费、职工取暖补贴和财务费用等组成。措施费、规费、安全生产费均单列，不属于企业管理费。"}, {"qid": "c2025-27", "type": "choice", "sub": "multiple", "year": 2025, "no": 27, "stem": "根据《公路工程质量检验评定标准》，分项工程质量检验时，应检查的质量保证资料有（　）。", "options": ["地基处理施工记录", "质量控制指标的试验记录", "桥梁施工监控资料", "施工过程非正常情况项目达到设计要求的认可证明文件", "施工过程各情况记录及其对工程质量影响分析评价资料"], "answer": ["A", "B", "C"], "explain": "质量保证资料应包括：(1)所用原材料、半成品和成品质量检验结果；(2)材料配合比、拌和加工控制检验和试验数据；(3)地基处理、隐蔽工程施工记录和桥梁、隧道施工监控资料；(4)质量控制指标的试验记录和质量检验汇总图表；(5)施工过程中遇到的非正常情况记录及其对工程质量影响分析评价资料；(6)施工过程中如发生质量事故，经处理补救后达到设计要求的认可证明文件等。D表述应为「发生质量事故补救后」，E表述应为「非正常情况」。"}, {"qid": "c2025-28", "type": "choice", "sub": "multiple", "year": 2025, "no": 28, "stem": "实施施工进度滞后影响到后序工作时，需要对进度计划进行调整，调整方法有（　）。", "options": ["改变某些工作的逻辑关系", "调整关键工作", "调整施工方案", "重新编制剩余工作进度计划", "增加非关键工作的资源量"], "answer": ["A", "B", "C", "D"], "explain": "进度计划调整方法：改变某些工作间的逻辑关系、调整关键工作的持续时间（资源）、调整施工方案、重新编制剩余工作进度计划等。E错：加资源要加在关键工作上，非关键工作加资源无助于赶工。"}, {"qid": "c2025-29", "type": "choice", "sub": "multiple", "year": 2025, "no": 29, "stem": "根据《公路工程建设项目概算预算编制办法》，下列费用中，属于设备购置费的有（　）。", "options": ["沥青混合料拌和设备费", "混凝土泵送设备费", "隧道消防动力设备费", "公路照明设备费", "路网运行监测设备费"], "answer": ["C", "D", "E"], "explain": "设备购置费是为满足公路初期运营、管理需要购置的构成固定资产标准的设备和虽低于固定资产标准但属于设备明确列入设备清单的设备费用，包括接口设备、隧道照明、消防、通风的动力设备，公路监控、收费、通信、路网运行监测、供配电及照明设备等。A、B属于施工所用设备（施工机械，属配套设备费/机械费）。"}, {"qid": "c2025-30", "type": "choice", "sub": "multiple", "year": 2025, "no": 30, "stem": "关于特种设备安全管理的说法，正确的有（　）。", "options": ["特种设备使用登记证复印件应置于特种设备旁边", "特种设备停用后，应断开设备电源", "特种设备应在有效期届满前15个工作日向相关机构提出定期检验要求", "特种设备的安全附件在校验有效期内，并灵敏、可靠", "特种设备管理制度应在使用场所张贴"], "answer": ["A", "B", "D", "E"], "explain": "C错：特种设备使用单位应在特种设备检验合格有效期届满前1个月向特种设备检验检测机构提出定期检验要求（不是15个工作日）。"}, {"qid": "k2025-1", "type": "case", "year": 2025, "no": "一", "title": "盾构隧道（下穿城市建筑群）", "background": "某绕城高速需下穿城市建筑群，下穿长度1560米，穿越砂卵石地层，存在少量地下水，最大埋深18m。设计要求采用盾构法施工。\n施工过程中发生以下事件：\n事件一：项目部根据现场周边环境、地质情况和设计要求，结合开挖面平衡压力，选用了密闭式盾构机。\n事件二：根据盾构法施工特点，施工单位编制了盾构隧道施工工序流程图如图1所示（图见原书p6：施工准备→始发井施工→盾构机安装就位→A→盾构机试掘进→盾构机正常掘进→接收井施工→B→盾构机拆解；两侧分支：反力架制作安装、盾构机制造运输）。\n事件三：项目部在盾构始发前制定了始发措施，部分措施如下：①盾构始发前应验算盾构反力架及其支撑的刚度和强度，反力架应牢固支撑在始发基座上。②盾构反力架整体倾斜刚度应与盾构基座的安装坡度一致。③加固盾构工作井端头地基，使其承载力满足始发要求。④洞门围护结构拆除后，盾构刀盘应离开开挖面。⑤盾构始发时，负环脱出盾尾后，应立即对管片环向进行加固。\n事件四：项目部编制的施工进度安排如下：始发井施工6个月；盾构机制造、运输、安装等9个月；盾构试掘进长度和接收段掘进长度分别为80m，月进度40m；正常掘进月进度180m。盾构制造与始发井施工同步。", "subQuestions": [{"q": "1.根据背景资料和事件一，项目部应选用哪种密闭式盾构机？该类型盾构机仓口出渣输送应采用哪种方式？", "a": "(1) 土压式（或：土压平衡盾构）(2分)\n(2) 螺旋输送机（或：螺旋运输机、螺旋出土机）(2分)"}, {"q": "2.写出图1中A、B工序的名称。", "a": "A：盾构始发（或：始发井准备）(2分)\nB：盾构接收 (2分)"}, {"q": "3.逐条判断事件三中的措施是否正确，若不正确，写出正确措施。", "a": "①不正确：反力架应牢固支撑在始发井结构上。(2分)\n②正确 (1分)\n③正确 (1分)\n④不正确：洞门围护结构拆除后，盾构刀盘应及时靠紧开挖面。(2分)\n⑤不正确：盾构始发时，负环脱出盾尾后，应立即对管片环向进行加固。(2分)"}, {"q": "4.根据背景资料和事件四，计算单洞完成施工的工期（单位：月，计算结果保留1位小数）。", "a": "工期＝9＋(80×2÷40)＋(1560−80×2)÷180＝20.8月 (4分)"}], "notes": "题干⑤与答案⑤文字相同（原书如此），疑为扫描识别误差，建议回原书p6/p19核对。"}, {"qid": "k2025-2", "type": "case", "year": 2025, "no": "二", "title": "沥青路面（SMA面层）", "background": "某施工单位承建高速公路四车道的沥青路面工程，起讫号为K5+000～K13+850，所属区域的年最高气温37℃，最低气温−7℃，当地年降雨量1480mm，沥青路面结构示意图如图2所示（图见原书p8：自上而下 4cm SMA-13／6cm AC-20C／7cm AC-25C／1cm A／17cm 5%水泥稳定碎石／20cm 4%水泥稳定碎石）。\n施工过程中发生以下事件：\n事件一：施工单位选定了一块地势低凹的荒地作为堆料场，按原材料堆放要求对粗集料、细集料和矿粉等材料在堆料场进行堆放和布设。\n事件二：施工单位关于「SMA沥青混合料」进行了第三级技术交底内容如下：①SMA沥青混合料属于悬浮密实结构，细集料不宜采用天然砂。②SMA混合料的粗集料较多是为了提高沥青混合料高温抗车辙能力。③SMA混合料需添加不低于0.3%的木质纤维素，由于其混合料的特殊性，拌和时间通常比AC沥青混合料的拌和时间短。\n事件三：沥青路面面层施工过程中，施工单位认真做好各种原材料、施工温度、矿料级配、马歇尔试验、压实度等试验工作，并随时检查铺筑厚度、宽度等指标问题。", "subQuestions": [{"q": "1.写出图2中A功能层的名称。", "a": "下封层 (3分)"}, {"q": "2.针对事件一中施工单位选定的堆料场，粗集料、细集料和矿粉的场地布设及堆放要求有哪些。", "a": "(1) 场地布设要求：场地应做硬化处理，做好排水（或：设置排水沟）。\n(2) 堆放要求：原材料分类堆放且有隔离分隔。矿粉要密闭防潮保存（或：设矿粉库房或储存罐）。(5分)"}, {"q": "3.第三级技术交底的交底人和被交底人分别是谁。", "a": "(1) 交底人：现场技术员 (2分)\n(2) 被交底人：班组全体作业人员 (2分)"}, {"q": "4.逐条判断事件二中技术交底内容是否正确，若不正确，写出正确内容。", "a": "①不正确：SMA沥青混合料属于密实骨架结构。(2分)\n②正确 (1分)\n③不正确：比AC沥青混合料的拌和时间长。(2分)"}, {"q": "5.事件三中，沥青路面面层施工过程中，随时检查的指标还有哪三项？", "a": "平整度、横坡度、高程 (3分)"}], "notes": ""}, {"qid": "k2025-3", "type": "case", "year": 2025, "no": "三", "title": "石方路基（深挖路堑＋高填方）", "background": "某高速公路工程，有一段填挖基本平衡的石方路基，其中挖方路堑边坡最大高度大于30m，填方最大高度大于20m。\n施工过程中发生以下事件：\n事件一：工程开工前，监理工程师退回了施工单位提交的危险性较大的分部分项工程专项施工方案，并附加如下意见：①报审的危险性较大的分部分项工程专项施工方案，由项目技术负责人审批不符合要求。②部分施工工艺流程不符合规范要求。③尽快完善并重新报审危险性较大的分部分项工程专项施工方案，以尽早开工。\n事件二：经查，被监理工程师退回的专项施工方案中有以下部分内容：\n①石质路堑绝大部分石质较硬，为方便现场施工组织，加快施工进度，边坡防护施工在路堑石方工程一次开挖完成后实施，应根据地形特征设置边坡观测点，对深挖路堑的稳定性进行监测；施工过程中只在分级平台高附后进行边坡复测和放样；路床底面有地下水时，可设置渗沟进行排除，渗沟应采用硬质碎石回填；石质路床施工完成后再施工路堑边沟。\n②部分石质路堑开挖采用炮孔直径为60mm、深度为5.5m的A爆破方法和光面爆破工艺，光面爆破工艺要求在开挖限界的周边排列一定间隔的炮孔，用控制B和药量的方法进行使其开挖断面形成一个光滑、平整的边坡。\n③石质路床碾挖部分应选用高强度的C材料进行找平处理。\n④路堤的填石料径应不大于500mm，并且不超过厚度的2/3，路床底面400mm范围内填料最大粒径不得大于Dmm，其中小于5mm的细料含量应不小于30%。填石路基完成后根据《公路工程质量检验评定标准》进行了质量检验，其实测项目包括压实、平整度、弯沉值、横坡、边坡坡度、中线偏位、宽度等。", "subQuestions": [{"q": "1.写出事件一①的正确做法。", "a": "专项施工方案由施工单位技术负责人审批。(3分)"}, {"q": "2.根据背景资料及事件一二，写出本段路基工程中应编制专项施工方案的四项危险性较大的分部分项工程名称。", "a": "深挖路堑工程、高填方路基工程、石方爆破工程、高边坡防护工程。(4分)"}, {"q": "3.写出事件二中A、B、C的内容和D的数值。", "a": "A：深孔；B：抵抗线（或：最小抵抗线）；C：砂砾、碎石；D：150。(5分)"}, {"q": "4.事件二①中有三处不符合规范要求的做法，写出正确做法。", "a": "①边坡防护应逐级开挖，逐级按设计要求进行防护。（或：开挖一级防护一级）(2分)\n②施工过程中，每挖深3～5m应复测一次边坡。(2分)\n③石质路床应与路堑边沟同步施工。(2分)"}, {"q": "5.指出事件二④中实测项目的两个关键项目。", "a": "压实、弯沉值。(2分)"}], "notes": ""}, {"qid": "k2025-4", "type": "case", "year": 2025, "no": "四", "title": "钢板组合梁桥（130m连续梁）", "background": "某施工单位承建某高速公路的一标段，标段全长11.6km，以高架桥为主。其中一处跨越地方道路，采用一联三跨35+60+35=130m的钢板组合连续梁，单幅桥宽为16.5m，基础为钻孔灌注桩和承台，下部结构为双肢混凝土立柱＋大悬臂预应力盖梁，主梁采用4片工字型钢板梁＋混凝土桥面板的组合结构。钢板梁之间采用横梁加强横向联系，钢板梁腹板与横梁腹板用高强度螺栓连接，与横梁、底板用熔透焊接连接。桥面系采用预制安装工艺，预制桥面板上预留剪力槽通过后浇混凝土与钢板梁连接。\n施工过程中发生以下事件：\n事件一：施工单位确定了高架桥控制测量等级，复测了原控制网，建立了加密的施工测量控制网。施工过程中，定期对控制网进行了复测。\n事件二：立柱钢筋骨架在钢筋加工厂内采用胎架法整体制作，运至现场进行吊装。根据《公路工程质量检验评定标准》，监理单位组织人员对钢筋骨架尺寸、受力钢筋间距、箍筋及构造钢筋间距、螺旋筋间距等实测项目进行了质量检验。受力钢筋5306KG；吊点加强筋42KG；防变形内撑筋226KG；箍筋2765KG；构造筋1830KG；架立筋311KG。\n事件三：钢板梁在钢结构厂进行分段制造，为保证焊缝质量，厂家首先对钢材和焊接材料开展了X工作；为校核钢板梁各部位的制造精度和匹配度，在厂内对首节段钢板梁进行了Y工作，检验合格后才成批生产。钢板梁节段运至工地现场，采用支架法进行拼装，支架顶部设置了预拱度，其中施工预拱度考虑了支架的弹性变形等因素。\n事件四：施工方案中规定了钢板梁工地连接和桥面板湿接缝施工的基本要求，其中部分要求如下：①钢板梁高强度螺栓安装时，对于不能自由穿入螺栓孔的，严禁使用电弧焊扩孔，可采用气割方法扩孔。②钢板梁栓接结构在焊接检验合格后终拧高强度螺栓连接。③为与预制桥面板保持一致，湿接缝混凝土采用预制桥面板的配合比。④湿接缝混凝土进行保温、保湿养护不少于7d，未达到设计强度85%前，不允许在桥面上通行车辆、堆放材料或进行影响其受力的其他施工作业。", "subQuestions": [{"q": "1.写出事件一中控制测量等级的最低等级和控制网定期复测周期的最长时间。", "a": "(1) 最低等级：四级 (1分)\n(2) 复测周期：6个月 (1分)"}, {"q": "2.事件二中，钢筋质量检验还需实测哪两个项目？", "a": "保护层厚度、弯起钢筋位置 (4分)"}, {"q": "3.写出图4-1中A设施的名称，该设施可获得计量？写出图4-2中B设施的名称，图中钢管＋型钢支架是否获得计量？计算事件二需要计量的钢筋的数量？", "a": "(1) A：缆风绳（或：风缆）；不计量 (4分)\n(2) B：混凝土基础。钢管＋型钢支架都不计量 (4分)\n(3) 需要计量的钢筋数量：5306＋2765＋1830＝9901KG (2分)"}, {"q": "4.写出事件三中X和Y工作的名称。", "a": "X：焊接工艺评定；Y：试拼装 (4分)"}, {"q": "5.施工预拱度除事件三中考虑的因素外，还应考虑哪两项因素？", "a": "①受载后由于杆件接头挤压和卸落装置压缩而产生的非弹性变形；\n②支架地基受载后的沉降变形。(4分)"}, {"q": "6.逐条判断事件四中的技术要求，如不正确请改正。", "a": "(1) 不正确：应采用铰刀进行钉孔修整，严禁采用气割方法扩孔。(2分)\n(2) 正确。(1分)\n(3) 不正确：湿接缝的混凝土配合比应专门设计。（或：单独设计）(2分)\n(4) 正确。(1分)"}], "notes": ""}, {"qid": "k2025-5", "type": "case", "year": 2025, "no": "五", "title": "特长隧道复合式路面（热拌沥青）", "background": "某高速公路单洞两车道特长隧道，起讫桩号ZK10+000～ZK13+985。洞内复合式路面结构从上至下依次为：3.5cm厚AC-13沥青混凝土表面层、4cm厚AC-16沥青混凝土下面层、22cm厚C30水泥混凝土基层、14cm厚C20水泥混凝土底基层等。热拌沥青混凝土路面施工工艺流程图如图5所示（图见原书p12：路缘石安装→喷洒透层油→试验段施工；机械试运转/配合比调试；沥青混凝土配合比设计→批准配合比；A→沥青混合料摊铺；沥青混合料生产；沥青混合料压实→压实度检测；沥青混合料抽提等试验→B→制定改进措施）。\n施工过程中发生以下事件：\n事件一：针对沥青混凝土路面施工，项目部第三级技术交底的部分内容如下：①沥青混合料出厂温度控制在140～165℃，若混合料出厂温度过高时应废弃。【新教材已删】②混合料若在运输车厢内已离析则应废弃。③沥青混凝土表面层的摊铺应采用走线法施工。④在沥青混合料压实过程中，采用雾状喷洒柴油，以保证沥青混合料碾压过程中不粘轮。\n事件二：施工单位对项目专项安全检查时，发现问题并提出整改要求：①存在问题：存在施工安全重大事故隐患。整改要求：项目部对该隐患编制「重大事故隐患治理方案」，方案包括：治理的目标和任务、经费和物资的落实、治理的时限和要求等内容。②存在问题：项目负责人仅对首件工程作业区蹲点带班生产。整改要求：项目负责人根据施工现场安全生产状况，对其他两个作业区域（或施工环节）加强调点带班生产。\n事件三：施工单位采用作业条件危险性评价法（LEC）开展安全风险等级评估。并且用D＝L×E×C来评价作业条件的危险等级。\n事件四：隧道内C30水泥混凝土基层用到的机械有：①平地机，②轮胎压路机，③水泥混凝土拌合楼，④滑模摊铺机，⑤挖掘机，⑥混凝土罐车，⑦振动压路机，⑧碎石撒布机，⑨空气压缩机等。", "subQuestions": [{"q": "1.写出热拌沥青混凝土路面施工流程中A、B分别代表的内容。", "a": "A：试机拌和；B：路面成型检测 (4分)"}, {"q": "2.逐条判断事件一中的内容是否正确，若不正确，需进行改正。", "a": "①正确。(1分)【新教材已删】\n②正确。(1分)\n③不正确：改正：表面层采用平衡梁法施工。(2分)\n④不正确：改正：采用雾状喷水法，保证沥青混合料在碾压过程中不粘轮。(2分)"}, {"q": "3.补充事件二中重大事故隐患治理方案的内容。", "a": "①采取的方法和措施；②负责治理的机构和人员；③安全措施和应急预案。(6分)"}, {"q": "4.补充事件二中其他两个作业区域（或施工环节）。", "a": "当日事故多发易发的施工环节或部位、危险性较大的分部分项工程。(2分)"}, {"q": "5.分别写出事件三中L、E、C、D代表的内容。", "a": "L：发生事故的可能性大小。\nE：人体暴露在这种危险环境中的频繁程度。\nC：一旦发生事故会造成的损失后果。\nD：危险性分值。(8分)"}, {"q": "6.选出事件四中用于C30水泥混凝土基层的施工机械。（用序号表示，如②③④……）", "a": "③④⑤⑥⑧。(4分)"}], "notes": "第1、6小问答案字母（A/B工序名、机械序号⑧）为视觉识别，个别字符建议回原书p19-20核对。"}]}], "qian": [{"id": "q10-101-1", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.1.1 施工进度计划类型", "imp": 0, "no": "1", "stem": "公路工程进度计划的主要形式有：（ ）。", "blanks": ["横道图、“S”曲线、垂直图、斜率图、网络图"]}, {"id": "q10-101-2", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.1.1 施工进度计划类型", "imp": 0, "no": "2", "stem": "公路工程的进度（ ）是以时间为横坐标，以各分部(项)工程或工作内容为纵坐标，按一定的先后施工顺序，用带时间比例的水平横线表示对应工作内容持续时间的进度计划图表。", "blanks": ["横道图"]}, {"id": "q10-101-3", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.1.1 施工进度计划类型", "imp": 0, "no": "3", "stem": "（ ）是以时间为横轴，以累计完成的工程费用的百分数为纵轴的图表化曲线。", "blanks": ["“S”曲线"]}, {"id": "q10-101-4", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.1.1 施工进度计划类型", "imp": 0, "no": "4", "stem": "“S”曲线：一般在图上标注有一条计划曲线和实际支付曲线，实际线高于计划线则实际进度（ ）于计划。", "blanks": ["快（或超前）"]}, {"id": "q10-101-5", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.1.1 施工进度计划类型", "imp": 0, "no": "5", "stem": "在公路工程中，常常将“S”曲线和横道图合并于同一张图表中，称为（ ），它既能反映各分部(项)工程的进度，又能反映工程总体的进度。", "blanks": ["公路工程进度表"]}, {"id": "q10-101-6", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.1.1 施工进度计划类型", "imp": 0, "no": "6", "stem": "（ ）是以公路里程或工程位置为横轴，以时间为纵轴，而各分部(项)工程的施工进度则相应地以不同的斜线表示。在图中可以辅助表示平面布置图和工程量的分布。垂直图很适合表示公路、隧道等线性工程的总体施工进度。", "blanks": ["垂直图"]}, {"id": "q10-101-7", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.1.1 施工进度计划类型", "imp": 0, "no": "7", "stem": "垂直图：坡度陡，进度（ ）；坡度平坦，进度（ ）。", "blanks": ["快", "慢"]}, {"id": "q10-101-8", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.1.1 施工进度计划类型", "imp": 0, "no": "8", "stem": "（ ）是以时间(月份)为横轴，以累计完成的工程量的百分数为纵轴，将分项工程的施工进度相应地用不同斜率表示的图表化曲(折)线。事实上就是分项工程的“S”曲(折)线，主要是作为公路工程投标文件中施工组织设计的附表，以反映公路工程的施工进度。", "blanks": ["斜率图"]}, {"id": "q10-102-1", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.1.2 施工进度计划编制", "imp": 0, "no": "1", "stem": "（ ）是由多个相互关联的进度计划组成的系统，它是施工项目进度控制的依据。", "b "施工进度计划实施的保证从内容上可概括为（ ）保证、（ ）保证、（ ）保证、（ ）与（ ）。", "blanks": ["组织", "技术", "合同", "资源", "经济"]}, {"id": "q10-201-2", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.2.1 进度控制方法和措施", "imp": 1, "no": "2", "stem": "公路工程项目进度检查包括的内容有哪四种？", "ans": "①项目部定期收集由承包单位提交的有关进度报表资料；②由驻地监理人员现场跟踪检查工程实际进展情况；③定期召开现场会议；④检查上次检查提出问题的处理情况。"}, {"id": "q10-201-3", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.2.1 进度控制方法和措施", "imp": 1, "no": "3", "stem": "进度计划检查的方式有哪些？", "ans": "横道图比较法、“S”形曲线比较法、“香蕉”形曲线比较法、前锋线比较法、列表比较法。"}, {"id": "q10-201-4", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.2.1 进度控制方法和措施", "imp": 1, "no": "4", "stem": "（ ）是指将在项目实施中检查实际进度收集的信息，经整理后直接用横道线并列标于原计划的横道线处，进行直观比较的方法。", "blanks": ["横道图比较法"]}, {"id": "q10-201-5", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.2.1 进度控制方法和措施", "imp": 1, "no": "5", "stem": "（ ）缺点是不便判断对工程的总体影响情况。", "blanks": ["横道图比较法"]}, {"id": "q10-201-6", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.2.1 进度控制方法和措施", "imp": 1, "no": "6", "stem": "“S”形曲线比较法：实际线的点在计划线的上方说明实际进度（ ）。", "blanks": ["提前（或超前）"]}, {"id": "q10-201-7", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.2.1 进度控制方法和措施", "imp": 1, "no": "7", "stem": "“S”形曲线的斜率可以反映进度的快慢，斜率越大，工程进度（ ）；斜率越小，工程进度（ ）；斜率为零，工程（ ）。", "blanks": ["越快", "越慢", "停工（或暂停）"]}, {"id": "q10-201-8", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.2.1 进度控制方法和措施", "imp": 1, "no": "8", "stem": "“香蕉”形曲线比较法：一条“S”形曲线是工程按（ ）完成时间安排进度所绘制的“S”形曲线，称ES曲线；而另一条“S”形曲线是工作按（ ）完成安排进度所绘制的“S”形曲线，称LS曲线。", "blanks": ["最早", "最迟"]}, {"id": "q10-201-9", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.2.1 进度控制方法和措施", "imp": 1, "no": "9", "stem": "（ ）：横道图法与“S”形曲线法的结合。", "blanks": ["公路工程进度表"]}, {"id": "q10-201-10", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.2.1 进度控制方法和措施", "imp": 1, "no": "10", "stem": "（ ）：世界银行贷款项目一般都要求提供此表。", "blanks": ["公路工程进度表"]}, {"id": "q10-201-11", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.2.1 进度控制方法和措施", "imp": 1, "no": "11", "stem": "（ ）比较法：适用于时标网络计划。", "blanks": ["前锋线"]}, {"id": "q10-201-12", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.2.1 进度控制方法和措施", "imp": 1, "no": "12", "stem": "用（ ）来进行进度检查是进度控制中计划检查最简单和最有效的方法。", "blanks": ["网络图（网络计划）"]}, {"id": "q10-202-1", "pian": "第3篇 项目管理实务", "chap": "第10章 施工进度管理", "sec": "10.2.2 进度延误处理", "imp": 0, "no": "1", "stem": "进度计划的调整方法有哪些？", "ans": "改变某些工作间的逻辑关系、关键工作的调整、调整施工内容、剩余工作重新编制进度计划（并相应调整资源供应等）。"}, {"id": "q11-111-1", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 1, "no": "1", "stem": "路面基层（底基层）施工常见的质量控制关键点有哪些？【能写出几个关键词】", "ans": "①基层强度、平整度、高程的检查与控制；②沥青（结合料）材料的检验与试验；③所用材料的含水量、拌和均匀性、配合比；④路面基层（底基层）的压实度、弯沉值、平整度及坡度；⑤如采用级配碎（砾）石，还需注意集料的级配和石料的压碎值。"}, {"id": "q11-111-2", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 1, "no": "2", "stem": "沥青混合料路面施工常见质量控制关键点有哪些？【能写出几个关键词】", "ans": "①设备组合及拌和设备计量装置的校验；②所用结合料（如水泥、石灰）剂量；③沥青混凝土拌和设备及计量装置的校验；④路面施工机械设备配置与压实方案；⑤沥青混凝土的拌和、运输及摊铺温度控制；⑥沥青混凝土摊铺厚度和摊铺中离析控制；⑦沥青混凝土的碾压与接缝施工。"}, {"id": "q11-111-3", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 1, "no": "3", "stem": "扩大基础质量控制关键点有哪些？【能写出几个关键词】", "ans": "①基底表面松散层的清理；②及时浇筑垫层混凝土，减少基底暴露时间；③大体积混凝土施工裂缝控制。"}, {"id": "q11-111-4", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 1, "no": "4", "stem": "钻孔灌注桩质量控制关键点有哪些？【能写出几个关键词】", "ans": "①桩位坐标与垂直度控制；②护筒埋深；③泥浆指标控制；④护筒内水头高度；⑤孔径的控制，防止缩径；⑥桩顶、桩底标高的控制；⑦清孔质量；⑧钢筋等接头质量；⑨导管接头质量检查与水下混凝土的灌注质量。"}, {"id": "q11-111-5", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 0, "no": "5", "stem": "沉井质量控制关键点有哪些？【能写出几个关键词】", "ans": "①初始平面位置的控制；②下沉过程中沉井偏斜与位置的动态控制；③封底混凝土浇筑工艺确保封底混凝土质量。"}, {"id": "q11-111-6", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 0, "no": "6", "stem": "钢围堰施工质量控制关键点有哪些？【能写出几个关键词】", "ans": "①钢围堰的设计与加工制造质量控制；②钢围堰基底水平及竖向限位装置的施工质量控；③封底混凝土浇筑时的导管布设与封底混凝土厚度控制；④抽水后封底混凝土的调平。"}, {"id": "q11-111-7", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 0, "no": "7", "stem": "实心墩质量控制关键点有哪些？【能写出几个关键词】", "ans": "①墩身模板内钢脚手架堆载质量控制；②墩身平面位置控制；③墩身垂直度控制；④模板接缝错台控制；⑤墩顶支座预埋件位置、数量控制。"}, {"id": "q11-111-8", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 0, "no": "8", "stem": "简支梁桥质量控制关键点有哪些？【能写出几个关键词】", "ans": "①简支梁混凝土的强度控制；②预拱度的控制；③支座预埋件的定位控制。"}, {"id": "q11-111-9", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 0, "no": "9", "stem": "支架施工质量控制关键点有哪些？【能写出几个关键词】", "ans": "①支架沉降量的控制；②支架基础压实及排水系统；③支架基础水平及竖向限位装置。"}, {"id": "q11-111-10", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 0, "no": "10", "stem": "先简支后连续质量控制关键点有哪些？【能写出几个关键词】", "ans": "①后浇段工艺控制、体系转换工艺控制、后浇段收缩控制、临时支座安装与拆除控制；②梁段间现浇带混凝土质量控制。"}, {"id": "q11-111-11", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 0, "no": "11", "stem": "挂篮悬臂施工质量控制关键点有哪些？【能写出几个关键词】", "ans": "①线形控制；②边跨及跨中合龙段混凝土的裂缝控制；③浇筑过程中的线形控制。"}, {"id": "q11-111-12", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 0, "no": "12", "stem": "预应力梁质量控制关键点有哪些？【能写出几个关键词】", "ans": "①张拉力及预应力筋伸长量控制；②预拱度控制。"}, {"id": "q11-111-13", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 0, "no": "13", "stem": "斜拉桥质量控制关键点有哪些？【能写出几个关键词】", "ans": "①主塔空间位置的控制；②斜拉索锚固管或锚箱空间定位控制；③斜拉索张拉拉力控制、索力调整。"}, {"id": "q11-111-14", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 0, "no": "14", "stem": "悬索桥质量控制关键点有哪些？【能写出几个关键词】", "ans": "①猫道线形控制；②主缆索股线形控制；③索股安装：基准索股的定位控制、索股锚固力的控制；④索股架设中基准索股位移及索股位置的调整；⑤索缆空缆线形控制；⑥索股定位控制；⑦钢丝拉力控制；⑧索鞍长度的确定；⑨加劲梁的焊接质量控制。"}, {"id": "q11-111-15", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 0, "no": "15", "stem": "公路隧道施工常见质量控制关键点有哪些？【能写出几个关键词】", "ans": "①认真测量、检查和修正开挖面，减少超挖；②制定切实可行的开挖方案；③遵循不同围岩级别的施工安全步距及支护；④在开挖后围岩自稳定时间的1/2以内完成监控量测；⑤收集资料，做好施工质量的信息反馈。"}, {"id": "q11-111-16", "pian": "第3篇 项目管理实务", "chap": "第11章 施工质量管理", "sec": "11.1.1 质量控制关键点", "imp": 0, "no": "16", "stem": "公路路基压实度现场检测方法主要有哪些？", "ans /* ---------------- 数据层 ---------------- */
const LS_PROG='glProg', LS_BANKS='glImportedBanks';
let prog = load(LS_PROG, {});
let imported = load(LS_BANKS, {});
function load(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } }
function save(){ localStorage.setItem(LS_PROG, JSON.stringify(prog)); localStorage.setItem(LS_BANKS, JSON.stringify(imported)); }

let banks = [], choices = [], cases = [];
function rebuildData(){
  banks = [...DATA.banks, ...Object.values(imported)];
  const all = [];
  banks.forEach(b => (b.questions||[]).forEach(q => all.push({...q, bank:b.name})));
  choices = all.filter(q=>q.type==='choice');
  cases   = all.filter(q=>q.type==='case');
}
const byId = {}; function indexIds(){ Object.keys(byId).forEach(k=>delete byId[k]); [...choices,...cases].forEach(q=>byId[q.qid]=q); }

/* ---------------- 状态/判分 ---------------- */
function pOf(id){ return prog[id] || (prog[id]={}); }
function qStatus(q){
  const p=prog[q.qid];
  if(q.type==='choice'){
    if(!p||!p.last) return 'new';
    return p.last==='r'?'ok':'bad';
  }else{
    if(!p||!p.last) return 'new';
    return p.last==='r'?'ok':'bad';
  }
}
function gradeChoice(q, sel){
  const ans=q.answer.slice().sort().join('');
  const s=sel.slice().sort().join('');
  if(q.sub==='single') return s===ans?'r':'w';
  if(s===ans) return 'r';
  const ansSet=new Set(q.answer);
  const hasWrong=sel.some(x=>!ansSet.has(x));
  return hasWrong?'w':'p'; // p=少选
}

/* ---------------- 工具 ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function optsLetters(n){ return 'ABCDEF'.slice(0,n).split(''); }
function badge(cls,txt){ return `<span class="badge ${cls}">${esc(txt)}</span>`; }
function statusBadge(q){
  const st=qStatus(q);
  if(st==='ok') return badge('b-ok', q.type==='choice'?'答对':'答对');
  if(st==='bad') return badge(q.type==='choice' && prog[q.qid]?.last==='p' ? 'b-part':'b-bad', prog[q.qid]?.last==='p'?'半对':'答错');
  return badge('b-new','未刷');
}

/* ---------------- 视图切换 ---------------- */
let view='choice';
$('#mainTabs').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  view=b.dataset.t;
  document.querySelectorAll('#mainTabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['choice','case','fav','wrong','qian'].forEach(t=>{ $('#view-'+t).style.display = t===view?'':'none'; });
  if(view==='fav') renderFav();
  if(view==='wrong') renderWrong();
  if(view==='qian') renderQian();
});

/* ---------------- 选择题 ---------------- */
let cList=[], cIdx=0, cListMode=false, cPicked=new Set(), cLocked=false;
function cFiltered(){
  const y=$('#cYear').value, ty=$('#cType').value, st=$('#cStatus').value, kw=$('#cSearch').value.trim();
  return choices.filter(q=>{
    if(y && String(q.year)!==y) return false;
    if(ty && q.sub!==ty) return false;
    if(st){ const s=qStatus(q);
      if(st==='fav' && !prog[q.qid]?.fav) return false;
      if(st!=='fav' && s!==st) return false; }
    if(kw && !q.stem.includes(kw)) return false;
    return true;
  });
}
function fillYear(sel, arr){
  const el=$(sel), cur=el.value;
  const years=[...new Set(arr.map(q=>q.year))].sort((a,b)=>b-a);
  el.innerHTML='<option value="">全部年份</option>'+years.map(y=>`<option value="${y}">${y} 年</option>`).join('');
  if(years.map(String).includes(cur)) el.value=cur;
}
function renderChoice(){
  cList=cFiltered();
  $('#cCount').textContent=`共 ${cList.length} 题`;
  if(cIdx>=cList.length) cIdx=Math.max(0,cList.length-1);
  $('#cPractice').style.display=cListMode?'none':'';
  $('#cList').style.display=cListMode?'':'none';
  if(cListMode) renderCList(); else renderCPractice();
}

  const box=$('#cList');
  if(!cList.length){ box.innerHTML='<div class="empty">没有符合条件的题目</div>'; return; }
  box.innerHTML=cList.map((q,i)=>{

function renderCPractice(){
  const box=$('#cPractice');
  if(!cList.length){ box.innerHTML='<div class="empty">没有符合条件的题目</div>'; return; }
  const q=cList[cIdx];
  const multi=q.sub==='multiple';
  box.innerHTML=`<div class="card">

      <button class="btn" id="cNext">下一题 →</button>
    </div>
    ${multi&&!cLocked?'<div class="acts"><button class="btn warn" id="cSubmit" style="flex:1 1 100%">提交答案（多选：错选不得分，少选得部分分）</button></div>':''}
  </div>`;
  // 选项点击
  box.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(cLocked) return;
    const k=b.dataset.k;
    if(!multi){ submitAnswer([k]); }
    else{ cPicked.has(k)?cPicked.delete(k):cPicked.add(k); b.classList.toggle('sel'); }
  }));
  const sub=$('#cSubmit'); if(sub) sub.addEventListener('click',()=>{ if(!cPicked.size){toast('请先选择选项');return;} submitAnswer([...cPicked]); });
  $('#cPrev').addEventListener('click',()=>{ if(cIdx>0){cIdx--;resetC();renderCPractice();} });
  $('#cNext').addEventListener('click',()=>{ if(cIdx<cList.length-1){cIdx++;resetC();renderCPractice();}else toast('已是最后一题'); });
  $('#cFav').addEventListener('click',()=>{ const p=pOf(q.qid); p.fav=p.fav?0:1; save(); renderCPractice(); updateStats(); });
  // 恢复已作答状态
  const p=prog[q.qid];
  if(p?.last && p?.sel){ replayAnswer(q, p.sel); }
}
function resetC(){ cPicked=new Set(); cLocked=false; }
function submitAnswer(sel){
  const q=cList[cIdx]; if(cLocked) return;
  const g=gradeChoice(q, sel);
  const p=pOf(q.qid);
  p.last=g; p.sel=sel.slice();
  if(g==='r'){p.c=(p.c||0)+1;} else {p.w=(p.w||0)+1;}
  save(); cLocked=true; replayAnswer(q, sel); updateStats();
}
function replayAnswer(q, sel){
  const ansSet=new Set(q.answer);
  const g=prog[q.qid]?.last;
  const selSet=new Set(sel);
  const box=$('#cAns');
  box.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true; const k=b.dataset.k;
    if(ansSet.has(k)) b.classList.add('hit');
    if(selSet.has(k)&&!ansSet.has(k)) b.classList.add('miss');
    if(selSet.has(k)&&ansSet.has(k)) b.classList.add('sel');
  });
  let verdict='', vc='';
  if(g==='r'){verdict='✓ 回答正确';vc='ok';}
  else if(g==='p'){verdict='△ 少选（所选每项得0.5分，已计入错题）';vc='part';}
  else {verdict='✗ 回答错误';vc='bad';}
  const sub=`<button class="btn warn" id="cRetry" style="flex:1 1 100%">重做本题</button>`;
  box.innerHTML=`<div class="ans show">
    <div class="verdict ${vc}">${verdict}</div>
    <div class="ans-line">参考答案：<b>${q.answer.join('')}</b>　你选了：${[...selSet].join('')||'—'}</div>
    <div class="expl"><span class="cap">【解析】</span>${esc(q.explain||'（无解析）')}</div>
    ${q.flag?`<div class="flagbox">⚠ 待核对：${esc(q.flag)}</div>`:''}
    <div class="acts">${sub}</div>
  </div>`;
  box.querySelector('.ans').style.display='block';
  $('#cRetry').addEventListener('click',()=>{
    const p=pOf(q.qid); delete p.last; delete p.sel; save(); cLocked=false; cPicked=new Set(); renderCPractice(); updateStats();
  });
}

function bindJump(box, arr, type){
  box.querySelectorAll('.li').forEach(li=>li.addEventListener('click',()=>{
    const q=arr[+li.dataset.i];
    if(type==='choice'){ switchTab('choice'); cListMode=false; cList=choices.slice(); cIdx=choices.findIndex(x=>x.qid===q.qid); renderChoice(); }
    else { switchTab('case'); kList=cases.slice(); kIdx=cases.findIndex(x=>x.qid===q.qid); renderCase(); }
    window.scrollTo(0,0);
  }));
}
function renderFav(){
  const fc=choices.filter(q=>prog[q.qid]?.fav), fk=cases.filter(q=>prog[q.qid]?.fav);
  const box=$('#favBody');
  let h='';
  if(fc.length){ h+=`<div class="grp-h">选择题（${fc.length}）</div>`+fc.map((q,i)=>liHTML(q,i,fc)).join(''); }
  if(fk.length){ h+=`<div class="grp-h">案例题（${fk.length}）</div>`+fk.map((q,i)=>liHTML(q,i,fk)).join(''); }
  if(!h) h='<div class="empty">还没有收藏。做题时点「☆ 收藏」即可加入。</div>';
  box.innerHTML=h;
  bindJump(box, fc.length?fc:[], 'choice'); // 注意：两组索引分开处理
  // 重新绑定：选择题跳选择，案例跳案例
  box.querySelectorAll('.li').forEach((li)=>{});
  bindFavMixed(box, fc, fk);
}
function bindFavMixed(box, fc, fk){
  const lis=box.querySelectorAll('.li');
  let ci=0, ki=0;
  // 顺序：先选择题组后案例组（与渲染顺序一致）
  const groups=[{arr:fc,type:'choice'},{arr:fk,type:'case'}];
  let g=0, idxIn=0;
  lis.forEach((li)=>{
    // 判断该 li 属于哪组：通过内部badge判断太脆弱，改为按渲染顺序推进
  });
  // 简化：直接按 DOM 顺序与 groups 重建映射
  let ptr=0;
  lis.forEach((li)=>{
    while(ptr<2 && groups[ptr].arr.length===0) ptr++;
    if(ptr>=2) return;
    const g=groups[ptr]; const i=idxIn++;
    if(idxIn>=g.arr.length){ ptr++; idxIn=0; }
    li.addEventListener('click',()=>{
      const q=g.arr[i];
      if(g.type==='choice'){ switchTab('choice'); cListMode=false; cList=choices.slice(); cIdx=choices.findIndex(x=>x.qid===q.qid); renderChoice(); }
      else { switchTab('case'); kList=cases.slice(); kIdx=cases.findIndex(x=>x.qid===q.qid); renderCase(); }
      window.scrollTo(0,0);
    });
  });
}
function renderWrong(){
  const wc=choices.filter(q=>{ const p=prog[q.qid]; return p?.last && p.last!=='r'; });
  const wk=cases.filter(q=>{ const p=prog[q.qid]; return p?.last && p.last!=='r'; });
  const box=$('#wrongBody');
  let h='';
  if(wc.length){ h+=`<div class="grp-h">选择题（${wc.length}）</div>`+wc.map((q,i)=>liHTML(q,i,wc)).join(''); }
  if(wk.length){ h+=`<div class="grp-h">案例题（${wk.length}）</div>`+wk.map((q,i)=>liHTML(q,i,wk)).join(''); }
  if(!h) h='<div class="empty">错题本是空的。答错/半对/没答好的题会自动进来。</div>';
  box.innerHTML=h;
  bindFavMixed(box, wc, wk);
}
function switchTab(t){
  view=t;
  document.querySelectorAll('#mainTabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  ['choice','case','fav','wrong','qian'].forEach(x=>{ $('#view-'+x).style.display = x===t?'':'none'; });

}

  $('#cntChoice').textContent=choices.length;
  $('#cntCase').textContent=cases.length;
  $('#cntFav').textContent=[...choices,...cases].filter(q=>prog[q.qid]?.fav).length;

}

const QIAN = (DATA.qian || []).slice();
let qianExtra = load('glQianExtra', []);
function qianAll(){ return QIAN.concat(qianExtra); }
function qById(id){ return qianAll().find(q=>q.id===id); }
function qianPians(){ const s=new Set(); qianAll().forEach(q=>s.add(q.pian||'未分类')); return [...s]; }
function qianChaps(pian){ const s=new Set(); qianAll().forEach(q=>{ if(!pian||(q.pian||'未分类')===pian) s.add(q.chap); }); return [...s].sort(); }
function qianSecs(pian,chap){ const s=new Set(); qianAll().forEach(q=>{ if((!pian||(q.pian||'未分类')===pian)&&(!chap||q.chap===chap)) s.add(q.sec); }); return [...s]; }
function qianStar(id){ return (prog.qianStar&&prog.qianStar[id])||0; }
function qianDone(id){ return !!(prog.qianDone&&prog.qianDone[id]); }
function qianSetStar(id,lv){
  if(!prog.qianStar) prog.qianStar={};
  if(lv) prog.qianStar[id]=lv; else delete prog.qianStar[id];
  save(); renderQian();
}
function qianMarkDone(id){ if(!prog.qianDone) prog.qianDone={}; prog.qianDone[id]=true; save(); }
function qNorm(s){ return (s||'').toLowerCase().replace(/[\s（）()、，,。.\/]/g,''); }
function qianCheck(q, card){
  const isOpen=!(q.blanks&&q.blanks.length);
  if(isOpen){
    const ta=card.querySelector('.qwrite');
    const val=(ta?ta.value:'').trim();
    const dd=card.querySelector('.qdiff');
    if(!val){ if(dd) dd.innerHTML=''; toast('请先在上方空白框内默写答案，再点「检查」'); return; }
    const r=qComputeDiff(val, q.ans||'');
    if(dd) dd.innerHTML=r.html;
    qianMarkDone(q.id);
    const res=card.querySelector('.qresult');
    if(res) res.textContent='✅ 已批改（绿＝连续2字及以上与标准相同，红删除线＝与标准不一致/多写）';
    save(); updateQianCnt();
    return;
  }
  const ins=card.querySelectorAll('.qblank'); let allOk=true;
  if(ins.length){
    ins.forEach((inp,i)=>{
      const ans=(q.blanks&&q.blanks[i]||'').trim();
      const ok=qNorm(inp.value)===qNorm(ans);
      inp.classList.toggle('ok',ok); inp.classList.toggle('bad',!ok);
      if(!ok) allOk=false;
    });
  }
  qianMarkDone(q.id);
  card.querySelectorAll('.qans').forEach(a=>a.classList.add('show'));
  const r=card.querySelector('.qresult');
  if(r){
    if(!ins.length) r.textContent='📖 已显示参考答案（本题为简答题，请自行对照）';
    else r.textContent=allOk?'✅ 全部正确':'❌ 有填错之处（红色为错），已显示参考答案';
  }
  if(ins.length){
    if(!allOk){ if(!prog.qianWrong)prog.qianWrong={}; prog.qianWrong[q.id]=true; }
    else if(prog.qianWrong&&prog.qianWrong[q.id]){ delete prog.qianWrong[q.id]; }
  }
  save(); updateQianCnt();
}
function qianStemHTML(q){
  const parts=q.stem.split(/(?:（\s*）|\(\s*\))/g);
  const n=(q.stem.match(/(?:（\s*）|\(\s*\))/g)||[]).length;
  let html='';
  for(let i=0;i<parts.length;i++){
    html+=esc(parts[i]);
    if(i<n){ const w=Math.max(4,(q.blanks&&q.blanks[i]||'').length+2); html+=`<input class="qblank" data-i="${i}" size="${w}" placeholder="（${i+1}）" />`; }
  }
  return html;
}
/* ---- 简答题默写批改：字符级对照（连续≥2字标绿，不一致/多写标红删除线）----
   规则与一建建筑抽背模式 computeDiff 一致：标点不计入、默认正确。 ---- */
const QPUNCT = /[　-〿＀-￯\s,.!?;:'"()\[\]<>{}_\-~`—…·、。；：？！""''（）《》〈〉【】「」『』〖〗]/;
function qNormText(s){ return (s||'').replace(QPUNCT,''); }
function qLcsLen(x, y){
  const n=x.length, m=y.length;
  if(!n||!m) return 0;
  const dp = Array.from({length:n+1}, ()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j] = x[i]===y[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  return dp[0][0];
}
function qDiffChar(rawUser, rawAns){
  const a = [...rawAns].map(c => ({c, p: QPUNCT.test(c)}));
  const b = [...rawUser].filter(c => !QPUNCT.test(c));
  const ac = a.filter(x => !x.p).map(x => x.c);
  const n = ac.length, m = b.length;
  const dp = Array.from({length:n+1}, () => new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j] = ac[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const hitStd = new Array(n).fill(false);
  const hitUser = new Array(m).fill(false);
  let i=0, j=0;
  while(i<n && j<m){
    if(ac[i]===b[j]){ hitStd[i]=true; hitUser[j]=true; i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]) i++;
    else j++;
  }
  const acToA = [];
  a.forEach((x,k)=>{ if(!x.p) acToA.push(k); });
  const stdMatched = a.map(()=>false);
  for(let k=0;k<n;k++) if(hitStd[k]) stdMatched[acToA[k]] = true;
  function runs(flags){
    const g = new Array(flags.length).fill(false);
    let run=0;
    for(let k=0;k<flags.length;k++){
      if(flags[k]) run++; else run=0;
      if(run>=2){ g[k]=true; if(k-1>=0) g[k-1]=true; }
    }
    return g;
  }
  const gStd = runs(stdMatched);
  const gUser = runs(hitUser);
  let uh='', buf='', cls='';
  function flushU(){ if(!buf) return;
    if(cls==='hit') uh+=`<span class="hit">${esc(buf)}</span>`;
    else if(cls==='miss') uh+=`<span class="miss">${esc(buf)}</span>`;
    else uh+=esc(buf); buf=''; }
  for(let k=0;k<m;k++){
    if(gUser[k]){ if(cls!=='hit'){ flushU(); cls='hit'; } buf+=b[k]; }
    else { if(cls!=='miss'){ flushU(); cls='miss'; } buf+=b[k]; }
  }
  flushU();
  let sh='', buf2='', cls2='';
  function flushS(){ if(!buf2) return;
    if(cls2==='hit') sh+=`<span class="hit">${esc(buf2)}</span>`;
    else if(cls2==='miss') sh+=`<span class="miss">${esc(buf2)}</span>`;
    else sh+=esc(buf2); buf2=''; }
  for(let k=0;k<a.length;k++){
    const x=a[k];
    if(x.p){ flushS(); sh+=esc(x.c); continue; }
    if(gStd[k]){ if(cls2!=='hit'){ flushS(); cls2='hit'; } buf2+=x.c; }
    else { if(cls2!=='miss'){ flushS(); cls2='miss'; } buf2+=x.c; }
  }
  flushS();
  let hit=0, total=0;
  for(let k=0;k<m;k++){ total++; if(hitUser[k]) hit++; }
  const pct = total ? Math.round(hit/total*100) : 0;
  const html =
    `<div class="meta">你写对约 <b>${hit}</b>/${total} 字（${pct}%）；绿＝连续2字及以上与标准相同，红删除线＝与标准不一致/多写，标点默认正确</div>`+
    `<div class="diff-cap">你写的：</div><div class="diff-box">${uh}</div>`+
    `<div class="diff-cap">标准答案：</div><div class="diff-box">${sh}</div>`;
  return {html, hit, total};
}
function qSplitPoints(a){
  const raw = (a||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const pts=[];
  for(const line of raw){
    for(const seg of line.split(/[；;]/)){
      const s = seg.trim().replace(/[。．.]$/, '').trim();
      if(!s) continue;
      pts.push(s);
    }
  }
  const NUM = /^[（(]?\d{1,2}[)）、.．]|^[①-⑳]|^[一二三四五六七八九十]+[、.．]/;
  const out=[]; const seen=new Set();
  for(const rawText of pts){
    const key = rawText.replace(NUM,'').trim();
    const norm = key.replace(/[　\s，,。．、；;：:？！?（）()【】「」"'《》<>]/g,'');
    if(!norm || norm.length<2) continue;
    if(seen.has(norm)) continue;
    seen.add(norm);
    out.push({raw: rawText, norm});
  }
  return out;
}
function qComputeDiff(rawUser, rawAns){
  const charRes = qDiffChar(rawUser, rawAns);
  const pts = qSplitPoints(rawAns);
  if(pts.length >= 2){
    const unorm = qNormText(rawUser);
    let hit=0;
    for(const p of pts){ if(qLcsLen(p.norm, unorm) >= 2) hit++; }
    const pct = Math.round(hit/pts.length*100);
    const meta = `<div class="meta">采分点命中 <b style="color:var(--ok)">${hit}</b>/${pts.length}（${pct}%）｜ 下方为你写的答案逐字对照：<span style="color:var(--ok)">绿</span>=连续2字及以上与标准相同，<span style="color:var(--bad)">红删除线</span>=与标准不一致/多写，标点默认正确</div>`;
    return {html: meta + charRes.html, hit, total: pts.length};
  }
  return charRes;
}

function qianCard(q){
  const lv=qianStar(q.id), done=qianDone(q.id);
  const impBadge=q.imp?badge('b-flag',q.imp):'';
  const isOpen=!(q.blanks&&q.blanks.length);
  const starBtns=[1,2,3].map(s=>`<button class="qstar ${lv===s?'on s'+s:''}" onclick="qianSetStar('${q.id}',${s===lv?0:s})" title="${s}星">${'★'.repeat(s)}</button>`).join('');
  const ansHTML = isOpen
    ? `<span class="ab">${esc(q.ans||'（暂无参考答案，待校）')}</span>`
    : q.blanks.map((b,i)=>`<span class="ab">（${i+1}）${esc(b)}</span>`).join('　');
  const writeBox = isOpen
    ? `<textarea class="qwrite" data-id="${q.id}" placeholder="在此默写答案（写完后点「检查」）…"></textarea>
       <div class="qdiff"></div>`
    : '';
  return `<div class="card qcard">
    <div class="crumbs">${badge('b-year',esc(q.chap))}${badge('b-case',esc(q.sec))}${impBadge}${q.flag?badge('b-flag','⚠ 待核'):''}${isOpen?badge('b-part','简答'):''}${done?badge('b-part','已练'):''}</div>
    <div class="q qian-q"><span class="qno">${esc(q.no||'')}</span>. ${qianStemHTML(q)}</div>
    ${writeBox}
    <div class="qans"><b>参考答案：</b>${ansHTML}</div>
    <div class="qresult"></div>
    <div class="qactions">
      <button class="mini" onclick="qianCheck(qById('${q.id}'),this.closest('.qcard'))">检查</button>
      <button class="mini" onclick="this.closest('.qcard').querySelectorAll('.qans').forEach(a=>a.classList.toggle('show'))">显示/隐藏答案</button>
      <span class="qstars">${starBtns}</span>
    </div>
  </div>`;
}
function renderQian(){
  const pian=$('#qPian').value, chap=$('#qChap').value, sec=$('#qSec').value;
  const star=$('#qStar').value, kw=$('#qSearch').value.trim().toLowerCase();
  const list=qianAll().filter(q=>{
    if(pian&&(q.pian||'未分类')!==pian) return false;
    if(chap&&q.chap!==chap) return false;
    if(sec&&q.sec!==sec) return false;
    if(star){ if(star==='undone'){ if(qianDone(q.id)) return false; } else if(String(qianStar(q.id))!==star) return false; }
    if(kw && !q.stem.toLowerCase().includes(kw)) return false;
    return true;
  });
  $('#qCount').textContent=`共 ${list.length} 题`+(qianAll().length?` · 全部 ${qianAll().length} 题`:'');
  const box=$('#qianList');
  if(!list.length){ box.innerHTML='<div class="empty">该筛选条件下暂无题目。可在「📥 导入题库」中选择含 qian 数组的 JSON 补充。</div>'; updateQianCnt(); return; }
  box.innerHTML=list.map(qianCard).join('');
  updateQianCnt();
}
function updateQianCnt(){ const el=$('#cntQian'); if(el) el.textContent=qianAll().length?String(qianAll().length):''; }
function refreshQianChapSec(){
  const pian=$('#qPian').value, curC=$('#qChap').value, curS=$('#qSec').value;
  $('#qChap').innerHTML='<option value="">全部章</option>'+qianChaps(pian).map(c=>`<option ${c===curC?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('');
  $('#qSec').innerHTML='<option value="">全部小节</option>'+qianSecs(pian,curC).map(s=>`<option ${s===curS?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('');
}
function initQianFilters(){
  const pianSel=$('#qPian');
  pianSel.innerHTML='<option value="">全部篇</option>'+qianPians().map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
  refreshQianChapSec();
  pianSel.addEventListener('change',()=>{ $('#qChap').value=''; $('#qSec').value=''; refreshQianChapSec(); renderQian(); });
  $('#qChap').addEventListener('change',()=>{ refreshQianChapSec(); renderQian(); });
  $('#qSec').addEventListener('change',renderQian);
  $('#qStar').addEventListener('change',renderQian);
  $('#qSearch').addEventListener('input',renderQian);
}

/* ---------------- 启动 ---------------- */
function initFilters(){
  fillYear('#cYear', choices); fillYear('#kYear', cases);
}
function boot(){
  rebuildData(); indexIds(); initFilters(); updateStats(); initQianFilters(); updateQianCnt();
  $('#srcNote').textContent=(DATA.meta?.source||'');
  renderChoice(); renderCase();
}
boot();
