<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>一建实务备考 · 建筑 / 公路</title>
<meta name="theme-color" content="#2f6df0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
  :root{
    --brand:#2f6df0; --brand-d:#1f57d6;
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2733; --sub:#6b7686;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden;
  }
  /* ===== 首页 ===== */
  #home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        background:linear-gradient(160deg,#2f6df0 0%,#5b8af6 55%,#8fb2fb 100%);
        padding:env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 24px);}
  .hero{text-align:center;color:#fff;margin-top:13vh;margin-bottom:30px;}
  .hero h1{font-size:26px;font-weight:800;margin:0 0 8px;letter-spacing:1px;}
  .hero p{margin:0;font-size:14px;opacity:.9;}
  .opts{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;}
  .opt{background:#fff;border-radius:18px;padding:20px 18px;display:flex;align-items:center;
       gap:16px;box-shadow:0 8px 24px rgba(20,40,90,.18);cursor:pointer;
       transition:transform .12s ease, box-shadow .12s ease;}
  .opt:active{transform:scale(.975);box-shadow:0 4px 14px rgba(20,40,90,.16);}
  .opt .ic{width:56px;height:56px;border-radius:14px;flex:0 0 auto;display:flex;
           align-items:center;justify-content:center;font-size:30px;color:#fff;}
  .opt.bz .ic{background:linear-gradient(135deg,#2f6df0,#5b8af6);}
  .opt.gl .ic{background:linear-gradient(135deg,#e8730a,#ffa64d);}
  .opt .txt{flex:1;min-width:0;}
  .opt .txt h2{margin:0 0 4px;font-size:18px;font-weight:700;color:var(--ink);}
  .opt .txt span{font-size:12.5px;color:var(--sub);line-height:1.5;display:block;}
  .opt .arrow{color:#c4ccd8;font-size:22px;flex:0 0 auto;}
  .foot{margin-top:auto;padding-top:22px;color:#eaf0ff;font-size:11.5px;opacity:.85;text-align:center;line-height:1.6;}
  /* ===== 子应用视图 ===== */
  #viewer{position:fixed;inset:0;display:none;flex-direction:column;background:#fff;}
  #viewer.on{display:flex;}
  .topbar{height:50px;flex:0 0 auto;display:flex;align-items:center;gap:10px;
          padding:0 12px;background:var(--brand);color:#fff;
          padding-top:env(safe-area-inset-top);}
  .topbar .back{font-size:15px;font-weight:600;display:flex;align-items:center;gap:4px;
               padding:8px 6px;cursor:pointer;}
  .topbar .ttl{font-size:16px;font-weight:700;}
  .frame{flex:1;width:100%;border:0;background:#fff;}
  @media (min-width:600px){ .opts{gap:20px;} .opt{padding:24px 22px;} }
</style>
</head>
<body>

<!-- 首页：两个平等专业选项 -->
<div id="home">
  <div class="hero">
    <h1>一建实务备考</h1>
    <p>请选择专业开始学习</p>
  </div>
  <div class="opts">
    <div class="opt bz" data-pro="yj">
      <div class="ic">🏗️</div>
      <div class="txt">
        <h2>建筑工程实务</h2>
        <span>抽背默写 · 200问 · 案例100 · 音频背诵</span>
      </div>
      <div class="arrow">›</div>
    </div>
    <div class="opt gl" data-pro="gl">
      <div class="ic">🛣️</div>
      <div class="txt">
        <h2>公路工程实务</h2>
        <span>真题刷题 · 选择 / 案例分开 · 错题本</span>
      </div>
      <div class="arrow">›</div>
    </div>
  </div>
  <div class="foot">
    建筑 = 原「一建背诵」全部内容　·　公路 = 2025 真题刷题<br>
    进度各自独立保存，互不影响
  </div>
</div>

<!-- 子应用承载层 -->
<div id="viewer">
  <div class="topbar">
    <div class="back" id="backBtn">‹ 返回</div>
    <div class="ttl" id="viewerTitle">建筑实务</div>
  </div>
  <iframe class="frame" id="appFrame" src="about:blank"></iframe>
</div>

<script>
  var home = document.getElementById('home');
  var viewer = document.getElementById('viewer');
  var frame = document.getElementById('appFrame');
  var title = document.getElementById('viewerTitle');
  var backBtn = document.getElementById('backBtn');

  var MAP = {
    yj: { src: 'yj/index.html', name: '建筑工程实务' },
    gl: { src: 'gl/index.html', name: '公路工程实务' }
  };

  function enter(pro){
    var m = MAP[pro];
    if(!m) return;
    title.textContent = m.name;
    frame.src = m.src;            // 每次进入重新加载，保证子 app 状态最新
    home.style.display = 'none';
    viewer.classList.add('on');
  }
  function goHome(){
    frame.src = 'about:blank';
    viewer.classList.remove('on');
    home.style.display = 'flex';
  }

  document.querySelectorAll('.opt').forEach(function(el){
    el.addEventListener('click', function(){ enter(el.getAttribute('data-pro')); });
  });
  backBtn.addEventListener('click', goHome);

  // 注册 PWA Service Worker（离线可用；网络优先，更新及时）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
